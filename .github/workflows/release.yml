name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン（例: 1.0.1、v不要）"
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/main ]]; then
            echo '::error::リリースはmainから実行してください。'
            exit 1
          fi
          pattern='^(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$'
          [[ "$RELEASE_VERSION" =~ $pattern ]]
          IFS=. read -r -a parts <<< "$RELEASE_VERSION"
          for part in "${parts[@]}"; do
            (( part <= 65535 ))
          done
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo '::error::指定したバージョンのタグは既に存在します。'
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: rename-windows-amd64
          path: release
      - name: Verify checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          tag_commit=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" | jq -r --arg ref "refs/tags/$RELEASE_TAG" '.[] | select(.ref == $ref) | .object.sha')
          if [[ -z "$tag_commit" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" --silent
          else
            test "$tag_commit" = "$RELEASE_COMMIT"
          fi
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          resolved_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$resolved_commit" = "$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" release/rename.exe release/SHA256SUMS --verify-tag --target "$RELEASE_COMMIT" --generate-notes
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.immutable' | grep -Fx true
