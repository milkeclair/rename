name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$RELEASE_TAG" =~ $pattern ]]
          git merge-base --is-ancestor HEAD origin/main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
  build:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.tag.outputs.version }}
  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: rename-windows-amd64
          path: release
      - name: Verify checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.tag.outputs.commit }}
        run: |
          resolved_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$resolved_commit" = "$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" release/rename.exe release/SHA256SUMS --verify-tag --target "$RELEASE_COMMIT" --generate-notes
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.immutable' | grep -Fx true
